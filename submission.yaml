submission:
  title: "PortIQ — AI-Powered Container Congestion Prediction & Port Operations Optimisation"
  problem_statement: >
    Port operators need to manage vessel arrivals, limited berth capacity,
    crane availability, and congestion. Congestion hotspots can be identified
    reactively after vessels are already queuing, while alternate routing
    decisions may come too late to help. The solution addresses the L1
    Container Congestion Predictor & Port Operations Optimiser challenge.
  solution_summary: >
    PortIQ is designed to predict port congestion using vessel schedules and
    berth-capacity information, recommend alternate routing strategies,
    optimise berth and crane assignments, and generate a 72-hour port
    operations plan for shift supervisors.
  key_features:
    - "Port dashboard"
    - "Congestion prediction"
    - "Alternate route recommendation"
    - "Berth and crane optimisation"
    - "72-hour port operations plan"
